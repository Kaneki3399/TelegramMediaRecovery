
name: Build TelegramMediaRecovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Normalize source line endings
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.Extension -in '.cs', '.csproj', '.props', '.targets', '.editorconfig' } |
            ForEach-Object {
              $content = [System.IO.File]::ReadAllText($_.FullName)
              $content = $content -replace "`r`n", "`n"
              $content = $content -replace "`r", "`n"
              [System.IO.File]::WriteAllText($_.FullName, $content, [System.Text.UTF8Encoding]::new($false))
            }

      - name: Publish Windows x64 self-contained
        run: dotnet publish src/TelegramMediaRecovery.Cli/TelegramMediaRecovery.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false -o publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMediaRecovery-Windows-x64
          path: publish/
          if-no-files-found: error
