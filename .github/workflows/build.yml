name: Build TelegramMediaRecovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows app
        run: dotnet publish src/TelegramMediaRecovery.Cli/TelegramMediaRecovery.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMediaRecovery-win-x64
          path: publish/
